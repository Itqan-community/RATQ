name: Frontend tests

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - 'payload-backend/**'
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - 'payload-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
