name: Branch Naming Check
on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main, beta, staging]

jobs:
  check:
    # The promotion PR (beta into main) comes from the long-lived beta branch, which is not a feature branch.
    if: github.head_ref != 'beta'
    uses: Itqan-community/.github/.github/workflows/branch-naming.yml@main
