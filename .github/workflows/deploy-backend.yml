name: Deploy backend

on:
  push:
    branches: [main, beta]
    paths:
      - 'payload-backend/**'
  pull_request:
    paths:
      - 'payload-backend/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payload-backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: payload-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # DEPLOY_SSH_KEY is a forced-command key (authorized_keys
          # `command=`): the server ignores whatever is sent here and always
          # runs /srv/ratq-repo/deploy-backend.sh instead.
          script: /srv/ratq-repo/deploy-backend.sh
