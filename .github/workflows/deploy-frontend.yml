name: Deploy frontend

# Production (ratq.itqan.dev) and beta.ratq.itqan.dev are one Cloudflare Worker, ratq-new-design.
# wrangler.jsonc owns the routes, so deploying with the committed config keeps the apex route in place.
# Rollback: delete the zone route ratq.itqan.dev/* (the old Pages deployment answers behind it),
# or run this workflow on an earlier commit with workflow_dispatch.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'payload-backend/**'
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build for Cloudflare
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test production
        run: |
          set -euo pipefail
          sleep 15
          for path in / /resources /resources/cms-4 /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://ratq.itqan.dev$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "unexpected status for $path"; exit 1; }
          done
          curl -sI https://ratq.itqan.dev/ | grep -i '^x-opennext: 1' || { echo "response is not served by the Worker"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' https://ratq.itqan.dev/resources/zzz-no-such-slug)
          [ "$code" = "404" ] || { echo "unknown slug should be 404, got $code"; exit 1; }
